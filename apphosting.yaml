# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting builds with `next build` and serves the result on Cloud Run. The runtime service
# account supplies Application Default Credentials, so the Admin SDK (storage + auth) needs no
# key file here.
#
# IMPORTANT (signed URLs): audio uploads/downloads use V4 signed URLs. On Cloud Run the runtime
# service account has no private key, so signing uses the IAM `signBlob` API. Grant that service
# account the "Service Account Token Creator" role on ITSELF and enable the IAM Service Account
# Credentials API, or audio signing will fail at runtime.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  # ── Server (Admin SDK) ────────────────────────────────────────────────────────
  - variable: STORAGE_BUCKET
    value: REPLACE_WITH_BUCKET # e.g. my-project.appspot.com
    availability:
      - RUNTIME

  # ── Firebase web config (inlined into the client bundle at build time) ──────────
  # These are public values; keep them as plain `value:` entries. To manage them as secrets
  # instead, replace `value:` with `secret: <secret-name>` (see Cloud Secret Manager docs).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_WITH_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: REPLACE_WITH_DATABASE_URL # e.g. https://my-project-default-rtdb.firebaseio.com
    availability:
      - BUILD
      - RUNTIME
